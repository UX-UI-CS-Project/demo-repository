<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หน้าบทเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --surface:#fff; --text:#1c2333; --muted:#667085;
  --line:#dfe3ec; --accent:#2f5bea; --accent-soft:#e8eeff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151c; --surface:#1b1f29; --text:#e8ebf3; --muted:#9aa3b5;
    --line:#2b3140; --accent:#7b9bff; --accent-soft:#232b45;
  }
}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}

.layout{display:flex;min-height:100vh}

/* sidebar ซ้าย */
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px}
.sidebar h3{font-size:18px;margin-bottom:16px}
.sidebar a{display:block;padding:8px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:15px}
.sidebar a.active,.sidebar a:hover{background:var(--accent-soft);color:var(--accent)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;font-weight:600}

.content{padding:24px;max-width:820px;width:100%;display:flex;flex-direction:column;gap:14px}
.content h1{font-size:22px;margin-bottom:6px}

/* แถบบทเรียน (กางออกได้) */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";color:var(--muted);transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
summary:hover{background:var(--accent-soft)}

.lesson-list{border-top:1px solid var(--line);padding:6px 10px 10px}
.lesson-list a{display:block;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none}
.lesson-list a:hover{background:var(--accent-soft);color:var(--accent)}

/* แถบควิซ (มีกล่องไอคอนด้านซ้าย) */
.quiz{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--text)}
.quiz:hover{border-color:var(--accent);background:var(--accent-soft)}
.quiz .box{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.quiz small{display:block;color:var(--muted)}

@media (max-width:700px){
  .layout{flex-direction:column}
  .sidebar{width:100%;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px}
  .sidebar h3{display:none}
  .sidebar a{white-space:nowrap}
  .content{padding:16px}
}
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <h3>เมนู</h3>
    <a href="index.html">หน้าหลัก</a>
    <a href="index.html" class="active">บทเรียน</a>
    <a href="#">แบบทดสอบ</a>
  </aside>

  <div class="main">
    <div class="topbar">ชื่อวิชา / ชื่อเว็บ</div>

    <div class="content">
      <h1>บทเรียนและควิซ</h1>

      <!-- บทเรียน: เพิ่มแถบได้เรื่อยๆ ด้วยการก๊อป <details> -->
      <details open>
        <summary>บทที่ 1: ชื่อบทเรียน</summary>
        <div class="lesson-list">
          <a href="lesson.html">1.1 หัวข้อย่อย</a>
          <a href="lesson.html">1.2 หัวข้อย่อย</a>
        </div>
      </details>

      <details>
        <summary>บทที่ 2: ชื่อบทเรียน</summary>
        <div class="lesson-list">
          <a href="lesson.html">2.1 หัวข้อย่อย</a>
          <a href="lesson.html">2.2 หัวข้อย่อย</a>
        </div>
      </details>

      <!-- ควิซ -->
      <a class="quiz" href="quiz.html">
        <span class="box">✏️</span>
        <span>ควิซบทที่ 1<small>10 ข้อ</small></span>
      </a>
    </div>
  </div>

</div>
</body>
</html>
