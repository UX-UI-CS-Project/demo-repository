<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บทเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --surface:#fff; --text:#1c2333; --muted:#667085;
  --line:#dfe3ec; --accent:#2f5bea; --accent-soft:#e8eeff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12151c; --surface:#1b1f29; --text:#e8ebf3; --muted:#9aa3b5;
    --line:#2b3140; --accent:#7b9bff; --accent-soft:#232b45;
  }
}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}

.layout{display:flex;min-height:100vh}

/* sidebar ซ้าย */
.sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px}
.sidebar h3{font-size:18px;margin-bottom:16px}
.sidebar a{display:block;padding:8px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:15px}
.sidebar a.active,.sidebar a:hover{background:var(--accent-soft);color:var(--accent)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;font-weight:600}

.content{padding:24px;max-width:820px;width:100%}

/* ปุ่มย้อนกลับ + ชื่อบทเรียน */
.back{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back a{font-size:22px;color:var(--accent);text-decoration:none;line-height:1;padding:4px 10px;border-radius:8px}
.back a:hover{background:var(--accent-soft)}
.back h1{font-size:20px}

/* การ์ดบทเรียน */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.cover{height:220px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:20px}
.cover img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.card p{margin-bottom:12px}

/* ลิงก์ / ไฟล์ */
.resources{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.res{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--text)}
.res:hover{border-color:var(--accent);background:var(--accent-soft)}
.res .ic{font-size:20px}
.res small{display:block;color:var(--muted)}

@media (max-width:700px){
  .layout{flex-direction:column}
  .sidebar{width:100%;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px}
  .sidebar h3{display:none}
  .sidebar a{white-space:nowrap}
  .content{padding:16px}
}
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <h3>เมนู</h3>
    <a href="#">หน้าหลัก</a>
    <a href="#" class="active">บทเรียน</a>
    <a href="#">แบบทดสอบ</a>
  </aside>

  <div class="main">
    <div class="topbar">ชื่อวิชา / ชื่อเว็บ</div>

    <div class="content">
      <div class="back">
        <a href="#" onclick="history.back();return false;">‹</a>
        <h1>บทที่ 1: ชื่อบทเรียน</h1>
      </div>

      <article class="card">
        <!-- รูป: เปลี่ยนเป็น <img src="ลิงก์รูป"> ได้ -->
        <div class="cover">รูป</div>

        <!-- ข้อความ -->
        <p>ใส่เนื้อหาบทเรียนตรงนี้</p>
        <p>เพิ่มย่อหน้าได้เรื่อยๆ ด้วยแท็ก p</p>

        <!-- ลิงก์ / ไฟล์ -->
        <div class="resources">
          <a class="res" href="https://example.com" target="_blank" rel="noopener">
            <span class="ic">🔗</span>
            <span>ลิงก์ประกอบการเรียน<small>https://example.com</small></span>
          </a>
          <a class="res" href="ไฟล์.pdf" download>
            <span class="ic">📄</span>
            <span>เอกสารประกอบ.pdf<small>ดาวน์โหลดไฟล์</small></span>
          </a>
        </div>
      </article>
    </div>
  </div>

</div>
</body>
</html>
